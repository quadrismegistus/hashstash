[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "hashstash"
dynamic = ["version"]
authors = [
  { name="Dr Ryan Heuser", email="ryan.heuser@gmail.com" },
]
description = "Serialize and cache anything: a dict-like stash with pluggable storage engines (pairtree, lmdb, sqlite, jsonl, redis, mongo, ...), serializers, and compression"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[tool.setuptools.dynamic]
version = {attr = "hashstash.__version__"}

[project.urls]
"Homepage" = "https://github.com/quadrismegistus/hashstash"
"Bug Tracker" = "https://github.com/quadrismegistus/hashstash/issues"

[project.optional-dependencies]
jsonpickle = ["jsonpickle", "numpy", "pandas"]

dataframe = ["pandas", "numpy", "pyarrow","fastparquet"]
sqlite = ["sqlitedict"]
redis = ["redis", "redis_dict"]
mongo = ["pymongo"]
msgpack = ["msgpack"]
cbor2 = ["cbor2"]
fsspec = ["fsspec"]
duckdb = ["duckdb"]
best = ["lmdb", "lz4"]
lmdb = ["lmdb"]
# plyvel builds from source against the system LevelDB library (no binary
# wheels), so it is intentionally NOT in the aggregate dev/all/engines extras —
# it would break `pip install .[dev]` on machines without libleveldb-dev. The
# leveldb engine tests importorskip cleanly when plyvel is absent.
leveldb = ["plyvel"]
diskcache = ["diskcache"]
memory = ["ultradict"]

filebased = [
  "pandas", "polars", "numpy", "pyarrow","fastparquet",
  "sqlitedict",
  "diskcache",
  "lmdb",
  "ultradict",
]
servers = [
  "redis", "redis_dict", "pymongo",
]
engines = [
    "pandas", "polars", "numpy", "pyarrow","fastparquet",
    "lmdb",
    "sqlitedict",
    "diskcache",
    "redis", "redis_dict",
    "pymongo",
    "ultradict",
    "duckdb",
]
dev = [
  # engines
  "pandas", "polars", "numpy", "pyarrow","fastparquet",
  "lmdb",
  "sqlitedict",
  "diskcache",
  "redis", "redis_dict",
  "pymongo",
  "ultradict",
  "duckdb",

  # serializers
  "jsonpickle",# "numpy", "pandas"
  "orjson",
  "msgpack",
  "cbor2",

  # compressers
  "lz4",
  "blosc",

  # utils
  "tqdm",
  "plotnine",
  "scikit-misc",

  # dev tools
  "pytest", "pytest-cov", "pytest-timeout", "hypothesis", "setuptools-scm", "ipython",
]
all = [
  # engines
  "pandas", "polars", "numpy", "pyarrow","fastparquet",
  "lmdb",
  "sqlitedict",
  "diskcache",
  "redis", "redis_dict",
  "pymongo",
  "ultradict",
  "duckdb",

  # serializers
  "jsonpickle",
  "orjson",
  "msgpack",
  "cbor2",

  # Compressers
  "lz4",
  "blosc",

  # utils
  "tqdm",
  "plotnine",
  "scikit-misc",
]
rec = ["pandas","pyarrow","lz4","ultradict"]

[tool.setuptools]
packages = {find = {include = ["hashstash*"]}}

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
